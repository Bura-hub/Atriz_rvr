# ═══════════════════════════════════════════════════════════════════════════════
# collision_monitor — la capa de seguridad del robot
# ═══════════════════════════════════════════════════════════════════════════════
# Manual, cap. 12. Se arranca desde `robot.launch.py`, NO desde `nav2.launch.py`.
#
# 🔴 POR QUÉ NO VA CON NAV2, que es donde lo pone el ejemplo oficial
#
#   Los estudiantes teleoperan el robot **sin Nav2**: la web hablará por rosbridge
#   y publicará velocidades directamente (plan, Fase 5). Si el monitor viviera en
#   `nav2.launch.py`, la teleoperación —que es justo el caso peligroso, porque hay
#   una persona mandando al robot contra una pared desde otro edificio— no estaría
#   protegida en absoluto.
#
#   Va con el robot. Todo lo que conduce pasa por él.
#
# 🔴 LA REGLA QUE HACE QUE ESTO FUNCIONE: `/cmd_vel` TIENE UN SOLO PUBLICADOR
#
#       Nav2 (velocity_smoother) ─┐
#       web / rosbridge          ─┼─► /cmd_vel_raw ─► collision_monitor ─► /cmd_vel ─► driver
#       teleop / scripts         ─┘
#
#   **Quien quiera mover el robot publica en `/cmd_vel_raw`.** Publicar en
#   `/cmd_vel` funciona —el driver lo obedece— pero **salta la seguridad sin dar
#   ningún aviso**. Es el tipo de fallo silencioso que este proyecto ya ha pagado
#   varias veces, así que se comprueba explícitamente:
#
#       ros2 topic info /cmd_vel --verbose   # UN publicador, y es collision_monitor
#
#   Para las mediciones de banco que sí necesitan mandar velocidad cruda:
#   `ros2 launch atriz_rvr_bringup robot.launch.py collision_monitor:=false`.
#
# ═══════════════════════════════════════════════════════════════════════════════
# DE DÓNDE SALEN LOS NÚMEROS
# ═══════════════════════════════════════════════════════════════════════════════
# Nada de esto está copiado del ejemplo de Nav2: sus polígonos son de 0.3-0.5 m
# para un robot de 0.22 m de radio, y con esos valores el nuestro se pararía a
# medio metro de todo.
#
# ✅ COTAS DEL ROBOT, medidas por el usuario el 2026-07-31 de punta a punta y CON
#    LAS ORUGAS: **18 cm de frente a atrás, 22 cm de lado a lado**.
#      media longitud  0.09   <- la que fija dónde para yendo de frente
#      media anchura   0.11
#      radio circunscrito 0.142
#
# ✅ AFINADAS el 2026-08-09, midiendo DESDE EL EJE DEL LIDAR: **9.0 cm al borde
#    TRASERO y 10.8 a cada costado** -> radio circunscrito sqrt(0.090^2 +
#    0.108^2) = **0.1406**.
#    🔎 El trasero está VALIDADO CON DOS INSTRUMENTOS: separando el robot 3 cm de
#       la pared el LIDAR leyó 12.20 cm donde la cinta predecía 12.00 (n=8268
#       rayos, perfil plano en +-20 grados). **2 mm de error.**
#
#    ✅ Y EL BORDE DELANTERO, CERRADO EL MISMO DIA A FAVOR DEL URDF: con el robot
#       tocando la pared de frente el perfil perpendicular sale PLANO en +-24
#       grados con mediana **10.03 cm** (n=3478, min 9.88 max 10.10) y los rayos
#       centrales RECORTADOS en range_min. La cinta habia dado 9.0: era AL CHASIS.
#         base_length 0.190 + laser_x -0.005  ->  9.5 - 0.5 = 9.0 detras
#                                             ->  9.5 + 0.5 = 10.0 delante   ✅
#       El URDF acierta en los tres ejes. Y el LIDAR NO esta centrado: va 5 mm
#       por detras, asi que delante y detras NO miden lo mismo.
#
# 🔴 LA REFERENCIA QUE IMPORTA ES `base_footprint`, NO EL LIDAR. El poligono se
#    centra ahi (`base_frame_id`), y el laser esta 5 mm por detras. Desde
#    base_footprint:
#         media longitud 9.5 · media anchura 10.85
#         RADIO CIRCUNSCRITO = sqrt(0.095^2 + 0.1085^2) = 0.1442
#    Es el numero que decide si girar es fisicamente posible, y por tanto el
#    suelo de cualquier `radius` que no quiera bloquear giros que si caben.
#
# 🔴 Antes de esa medida el URDF decía 0.218 x 0.185 (ficha publicada, y CRUZADO:
#    modelaba un robot más largo que ancho siendo al revés). Todos los huecos
#    medidos el 2026-07-31 se calcularon con media longitud 0.109 y por tanto
#    salieron **2 cm cortos**. Corregidos en `17_collision_monitor.txt`.
#
#   Distancia de frenado, derivada de la medida del watchdog (CHANGELOG 2026-07-30,
#   parte 5): 527 ms y 7.9 cm en total, de los cuales ~300 ms eran el
#   `cmd_vel_timeout` del driver conduciendo a plena velocidad. Lo FÍSICO son
#   ~227 ms. Despejando a ~0.19 m/s:  frenada ≈ 0.116 · v  (m, con v en m/s).
#
#   Latencia de detección = edad del barrido (X2 a 11.5 Hz → ≤ 87 ms)
#                         + un período de cmd_vel (smoother a 20 Hz → 50 ms)
#                         ≈ 0.15 s
#
#              v      latencia   frenada    parada total
#           0.25 m/s   3.8 cm     2.9 cm      6.7 cm
#           0.40 m/s   6.0 cm     4.6 cm     10.6 cm     ← el máximo del robot
#
#   ⚠️ ESO ES LO QUE FRENA EL ROBOT, PERO NO ES LO QUE FIJA LA HOLGURA. Con un
#      polígono `approach` quien manda es el `radius` (ver abajo): la velocidad
#      baja sola según se acerca, así que la parada total no la marca la frenada
#      sino la asíntota del controlador. Medido con el monitor en el lazo en
#      `17_collision_monitor.txt`.
#
#   🔴 EL PUNTO CIEGO SOBRESALE DEL CHASIS POR DELANTE Y POR DETRAS. Esto decía
#      que no, calculado con la media longitud CRUZADA del URDF (0.109):
#
#        «su punto ciego de 10 cm cae DENTRO del chasis (media longitud 0.109 m).
#          No hay zona muerta alrededor del robot.»
#
#      El X2 tiene `range_min: 0.1` y `laser_x: -0.005` (NO 0.0). Desde el EJE DEL
#      LASER el borde trasero esta a 9.0 y el delantero a 10.0, asi que:
#
#        DETRAS    0.100 - 0.090 = 1.0 cm CIEGO fuera del chasis
#        DELANTE   0.100 - 0.100 = justo en el borde
#        costados  0.100 - 0.1085 = dentro del chasis, sin zona muerta
#
#      ⚠️ Ningún polígono puede cubrir ese centímetro: no es cuestión de ajustar
#         `radius`, es que el sensor no da el dato. Medido el 2026-08-09: con el
#         robot TOCANDO la pared, los 10 277 rayos traseros se descartaron por
#         debajo de `range_min` y sólo sobrevivió uno oblicuo, recortado en 10.02.
# ═══════════════════════════════════════════════════════════════════════════════

collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"

    # ── La cadena de arriba, en dos líneas ────────────────────────────────────
    cmd_vel_in_topic: "cmd_vel_raw"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"

    transform_tolerance: 0.2

    # 🔴 0.5 s, no los 5.0 del ejemplo. Si el LIDAR deja de publicar, el monitor
    # para el robot: 0.5 s son ~6 barridos perdidos del X2. Cinco segundos a
    # 0.25 m/s son 1.25 m conduciendo a ciegas.
    #
    # ⚠️ CONSECUENCIA: sin LIDAR el robot NO SE PUEDE CONDUCIR. Es lo correcto en
    #    un laboratorio remoto donde nadie puede levantarlo, pero desconcierta si
    #    no se sabe. La salida es `collision_monitor:=false`.
    source_timeout: 0.5

    # Corrige el movimiento del robot entre el instante del barrido y ahora,
    # usando TF. Podemos permitírnoslo: `odom -> base_footprint` está verificado
    # y la deriva de SLAM es de 1-3 cm (manual, cap. 9.12).
    base_shift_correction: True

    stop_pub_timeout: 1.0

    # ── Se evalúan EN ESTE ORDEN, y el monitor corta en cuanto uno da STOP ────
    polygons: ["Aproximacion", "Precaucion"]

    # ── 1. La protección de verdad ────────────────────────────────────────────
    # Proyecta la huella del robot a lo largo de la velocidad COMANDADA y para si
    # predice choque dentro de `time_before_collision`.
    #
    # 🔴 ES DE TIPO `approach`, NO `stop`, Y LA RAZÓN IMPORTA:
    #
    #   Un polígono `stop` para CUALQUIER movimiento mientras haya algo dentro. Un
    #   robot que quede pegado a una pared se congela: no puede ni retroceder ni
    #   girar para salir. En un laboratorio remoto **no hay nadie que lo levante**,
    #   así que ese robot queda inservible hasta que alguien vaya al edificio.
    #
    #   `approach` solo bloquea el movimiento que LLEVA al choque. Contra la pared,
    #   el robot puede retroceder y girar; solo se le niega seguir avanzando.
    #
    #   Escala sola con la velocidad, que es la otra ventaja: a 0.40 m/s reacciona
    #   a 40 cm, a 0.10 m/s a 10 cm. Un polígono fijo tendría que dimensionarse
    #   para el peor caso y le impediría acercarse a nada yendo despacio.
    Aproximacion:
      # `circle`, no `polygon`: así NO depende de
      # `/local_costmap/published_footprint`, que solo existe si Nav2 corre — y
      # aquí el monitor tiene que funcionar también en teleoperación pura.
      type: "circle"
      # 🔴 0.15 DESDE EL 2026-08-09. Antes 0.18, y el cambio está medido de punta
      # a punta — ver el bloque «POR QUÉ 0.15» al final de este comentario.
      # Es el parámetro que fija la HOLGURA con la que para, y la primera vez se
      # puso mal:
      #
      #   `approach` NO es una parada de seguridad, es un frenado suave. Nav2
      #   escala la velocidad para que el choque caiga justo en
      #   `time_before_collision`, así que según baja la distancia baja la
      #   velocidad y el robot se acerca ASINTÓTICAMENTE AL CONTACTO.
      #
      #   Medido el 2026-07-31 con radius 0.11 y media longitud de chasis 0.09:
      #   la asíntota era 2 cm, y el robot **paró a 3.0 cm de la pared**.
      #   Funcionó exactamente como está escrito; lo que estaba mal era esperar
      #   que dejara hueco.
      #
      #   La holgura sale de inflar el círculo:  hueco ≈ radius − 0.095
      #   ✅ MEDIDO EL 2026-08-09 CON LOS DOS VALORES, contra una pared:
      #
      #        radius   a 0.25 m/s          a 0.40 m/s (máxima)
      #         0.18    9.3 9.4 9.3 9.4     10.9  (fichero 17)
      #         0.15    6.3 6.3             7.4 6.6
      #
      #      y el perfil del recorte es lineal en la distancia al círculo:
      #        0.18 -> mando ~ 0.0125 x (d_LIDAR - 18 cm)   cero en 18
      #        0.15 -> mando ~ 0.0125 x (d_LIDAR - 15 cm)   cero en 15
      #
      # 📝 La holgura DEPENDE DE LA DIRECCIÓN, porque el robot no es un círculo.
      #    Con 0.15 y las cotas reales (media longitud 0.095, anchura 0.1085,
      #    circunscrito 0.1442):
      #      de frente  0.15 − 0.095 = 5.5 cm   <- lo que se mide contra una pared
      #      de costado 0.15 − 0.1085 = 4.2 cm
      #      en esquina 0.15 − 0.1442 = 0.6 cm  <- el caso peor
      #
      # ⚠️ Inflar esto es hacer el robot más gordo a efectos de seguridad, y el
      #    coste está MEDIDO, no estimado: con 0.18 el robot **NO cruza un paso de
      #    40 cm**. El 2026-07-31 entró en la boca de uno, con el camino despejado
      #    delante y sin tocar nada, y se quedó bloqueado — el borde estaba a
      #    17 cm y el círculo mide 18. Sí pudo salir marcha atrás.
      #      pasillo mínimo ≈ 2 × radius  ->  0.18 exigía 36 cm; 0.15 exige 30.
      #    Detalle en `19_paso_estrecho.txt`.
      #
      # 🔴🔴 Y EL 2026-08-09 SE MIDIÓ QUE ES PEOR: NO SIEMPRE PUEDE SALIR.
      #    Con la pared **DETRÁS** a 16,8 cm y 188 cm libres delante, mandando por
      #    `/cmd_vel_raw` (el camino normal):
      #
      #        AVANZAR alejándose de la pared  ->  0.0 cm   monitor: APROXIMACION
      #        GIRAR en el sitio               ->  0.0 °
      #        RETROCEDER hacia la pared       ->  0.0 cm
      #
      #    **INMOVILIZACIÓN TOTAL: ni siquiera puede ALEJARSE.** `approach` escala
      #    el mando ENTERO —lineal y angular— por el tiempo hasta colisión, y con
      #    un punto ya DENTRO del círculo ese factor es 0, **sin mirar si el
      #    movimiento acerca o aleja**. Sólo sale a mano.
      #    (En el fichero 19 el obstáculo estaba AL LADO y sí pudo retroceder. Por
      #     qué una geometría deja salir y la otra no: ⏳ NO VERIFICADO.)
      #
      # ✅ Y GIRANDO NO ROZARÍA NADA. Con el monitor puenteado y el usuario
      #    mirando: **359,6° y 358,8° de 360**, en 12,6 s —los mismos que en campo
      #    abierto— y su veredicto: «no ha tocado la pared en ningún momento».
      #    El radio circunscrito del robot es 14,06 cm contra un círculo de 18:
      #    (18 x 21,6 cm MEDIDOS CON CINTA el 2026-08-09: el eje del LIDAR está a
      #     9,0 cm de frente y atrás y a 10,8 de cada costado, o sea CENTRADO.
      #     Validado contra el propio LIDAR con 2 mm de error. Los 21,8 x 18,5 del
      #     URDF son las mismas magnitudes CRUZADAS DE EJE: el RVR es más ancho
      #     que largo, y el fichero 19 ya lo avisaba.)
      #    **el monitor es más gordo que el robot**, así que hay una franja de
      #    14,2 a 18 cm donde inmoviliza a un robot que puede moverse sin rozar.
      #
      # 🔴🔴 ESTE PARAMETRO ES INERTE EN CALIENTE. `ros2 param set` lo guarda y
      #    `get` lo devuelve, pero el nodo NO reconstruye el poligono: sigue con el
      #    que creo al configurarse. Demostrado el 2026-08-09 con un radio MUCHO
      #    mayor, que deberia frenar mucho antes:
      #
      #        radius 0.18 -> el mando se anula en 18 cm · paro a 19.4
      #        radius 0.15 -> el mando se anula en 18 cm · paro a 19.2
      #        radius 0.30 -> el mando se anula en 18 cm · paro a 19.3
      #
      #    Tres perfiles identicos: `mando ~ 0.0125 x (distancia_LIDAR - 18 cm)`.
      #    ⚠️ CAMBIAR ESTE VALOR EXIGE EDITAR ESTE FICHERO Y REINICIAR EL SERVICIO.
      #       O sea es un cambio de IMAGEN DORADA para los 16 robots, no un boton:
      #       hay que volver a medir el hueco al parar antes de aplicarlo.
      #    🔴 Y retracta lo que aqui se escribio antes —«causa aislada bajando el
      #       radio a 0.12»—, que ademas tenia el control roto: aquella prueba tenia
      #       la pared a 18.3 cm y no a 16.8, o sea ya FUERA del circulo.
      #
      # ✅ HUECO AL PARAR, MEDIDO con este valor (0.18) a 0.25 m/s:
      #        9.3 · 9.4 · 9.3 · 9.4 cm   (n=4, dispersion 1 mm)
      #    Cuadra con la asintota `0.18 - 0.095 = 8.5 cm` mas ~1 cm de arrastre, y
      #    con los 9.9 cm del fichero 17. El escalon de 0.25 a 0.100 a ~36 cm es el
      #    poligono `Precaucion` con su slowdown_ratio 0.4, no la aproximacion.
      #
      # ⏳ NO SE BAJA, y por eso sigue en 0.18: este número fija DOS cosas en
      #    sentidos opuestos —el hueco al parar y el pasillo mínimo— y el 0.18 está
      #    respaldado por «para a 20,8 cm sin chocar» de la prueba de aceptación.
      #    Bajarlo EXIGE repetir esa medida. 👤 Decisión del usuario.
      #    Detalle en `93_el_robot_atrapado_por_su_propia_seguridad.txt`.
      #
      # 🔴 REGLA DE OPERACIÓN MIENTRAS TANTO, y vale para los 16 robots:
      #    **no dejes un robot con nada a menos de 20 cm.** Si se queda mudo y no
      #    obedece, mira `/collision_monitor_state` antes de pensar que se colgó.
      #
      # ═══════════════════════════════════════════════════════════════════════
      # POR QUÉ 0.15 Y NO 0.18 — decidido el 2026-08-09 con todo medido
      # ═══════════════════════════════════════════════════════════════════════
      # El barrido de pared (evidencia 94: 24 estaciones a mano, las CUATRO
      # direcciones) midió que este círculo INMOVILIZA POR COMPLETO al robot
      # —no gira, no avanza y ni siquiera puede ALEJARSE— siempre que haya algo
      # dentro de él, porque `approach` escala el mando entero por el tiempo
      # hasta colisión y con un punto ya dentro ese factor es 0.
      #
      # 🔎 LA SIMETRÍA QUE DECIDE EL VALOR:
      #
      #      banda de trampa  =  margen ante el error del LIDAR  =  radius − 0.1442
      #
      #    SON EL MISMO NÚMERO. Por debajo del circunscrito (0.1442) el bloqueo es
      #    CORRECTO —la esquina barrería el obstáculo—; por encima es un robot
      #    congelado pudiendo girar sin rozar. No se puede encoger uno sin el otro.
      #
      #      radius   banda de trampa   hueco al parar 0.40 m/s   aceptación F6
      #       0.18         3.6 cm            10.9 cm               pasa
      #       0.15         0.6 cm             7.4 / 6.6 cm         pasa
      #       0.145        0.1 cm             ~6.9 cm              (sin medir)
      #
      # ✅ 0.15 reduce la inmovilización SEIS VECES y conserva ~7 cm de holgura a
      #    velocidad máxima, el doble del umbral de contacto del guion (11 cm
      #    desde el LIDAR). Verificado a la misma distancia con los dos valores:
      #      pared a 15.8 cm de base_footprint
      #        con 0.18 -> congelado
      #        con 0.15 -> gira 34.9 grados, retrocede 5.7, avanza 2.5
      #
      # 🔴 NO SE BAJA MÁS. Con 0.145 el margen queda en 0.1 cm contra un ruido de
      #    LIDAR MEDIDO de +-0.3 cm en ese mismo barrido: autorizaría a girar
      #    cuando el robot NO cabe. Peor remedio que la enfermedad.
      #
      # ⚠️ LO QUE 0.15 NO ARREGLA: quedan 0.6 cm de banda donde el robot sigue
      #    congelado sin tocar nada, y el centímetro CIEGO de `range_min` por
      #    delante y por detrás, que no depende de este parámetro.
      #
      # 🔴 ESTE PARÁMETRO NO SE PUEDE PROBAR EN CALIENTE. `ros2 param set` lo
      #    guarda y `get` lo devuelve, pero el nodo NO reconstruye el polígono:
      #    con 0.18, 0.15 y 0.30 en caliente el perfil sale IDÉNTICO. Hay que
      #    editar este fichero y REINICIAR `atriz-robot`.
      radius: 0.15
      action_type: "approach"
      # 1.0 s cubre con holgura los ~0.38 s reales (0.15 latencia + 0.23 frenada).
      time_before_collision: 1.0
      simulation_time_step: 0.05
      # ⚠️ EL PRIMER PARÁMETRO A AJUSTAR si hay paradas fantasma o si el robot no
      # ve una pata de silla. 2 es sensible a propósito: una parada de más molesta,
      # una de menos choca. El X2 da 254 puntos en 360° (1.42°/punto), así que un
      # obstáculo de 5 cm a 30 cm de distancia son ~7 puntos.
      min_points: 2
      visualize: True
      polygon_pub_topic: "poligono_aproximacion"
      enabled: True

    # ── 2. Frenar antes, para que la parada no sea brusca ─────────────────────
    # 🔴 `slowdown`, NUNCA `stop`, por lo mismo de arriba: un polígono fijo que
    # pare deja al robot atrapado. Este solo reduce la velocidad, así que en el
    # peor caso el robot va lento — nunca queda inmóvil sin salida.
    #
    # Caja alrededor del robot. Con las cotas MEDIDAS (media longitud 0.09, media
    # anchura 0.11) las holguras reales de esta caja son:
    #   delante  0.36 − 0.09 = 27 cm
    #   detrás   0.24 − 0.09 = 15 cm
    #   laterales 0.20 − 0.11 = 9 cm
    # En el pasillo de pruebas de 0.8 m las paredes quedan a ±0.40: no lo tocan.
    # 📝 La geometría no se ha cambiado al corregir las cotas: se dejó como estaba
    #    porque es la que se probó (4 navegaciones, manual 11.13). Cambiarla
    #    obligaría a repetirlas.
    Precaucion:
      type: "polygon"
      points: "[[0.36, 0.20], [0.36, -0.20], [-0.24, -0.20], [-0.24, 0.20]]"
      action_type: "slowdown"
      slowdown_ratio: 0.4       # 0.25 m/s -> 0.10 m/s
      min_points: 4
      visualize: True
      polygon_pub_topic: "poligono_precaucion"
      enabled: True

    # ── La fuente ─────────────────────────────────────────────────────────────
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      enabled: True
