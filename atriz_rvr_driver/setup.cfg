; Redirige los console_scripts de setuptools a lib/<paquete>/, que es donde
; `ros2 run` los busca.
;
; SIN ESTE FICHERO el paquete compila sin un solo aviso, el módulo se instala
; correctamente en site-packages, y `ros2 run atriz_rvr_driver rvr_driver_node`
; responde «No executable found». El script acaba en install/<pkg>/bin/, que
; ros2 no mira.
;
; Pasó el 2026-07-30: `colcon build` dijo «Finished» y el nodo no arrancaba.
; Es un fallo silencioso de manual — el build no se queja de nada.
[develop]
script_dir=$base/lib/atriz_rvr_driver
[install]
install_scripts=$base/lib/atriz_rvr_driver
